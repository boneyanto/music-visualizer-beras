[package]
name = "license_generator"
version = "1.0.0"
edition = "2021"

[dependencies]
ed25519-dalek = { version = "2.1.1", features = ["std", "rand_core"] }
rand_core = { version = "0.6.4", features = ["std"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "license_generator"
path = "main.rs"
