name: Release App (Windows & macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Pilih platform yang ingin di-compile'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos

jobs:
  build-windows:
    name: Build Windows (.exe & .msi)
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract Release Notes
        id: extract_notes
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const content = fs.readFileSync("CHANGELOG.md", "utf8");
            const tag = process.env.GITHUB_REF_NAME || "v3.1.7";
            const match = content.match(new RegExp(`## \\[${tag}\\][^\\n]*\\n([\\s\\S]*?)(?=\\n## \\[|$)`));
            const notes = match ? match[1].trim() : "Music Visualizer Beras release";
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `notes<<EOF\n${notes}\nEOF\n`);
          '

      - name: Build Tauri App Windows
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Music Visualizer Beras ${{ github.ref_name }}'
          releaseBody: ${{ steps.extract_notes.outputs.notes }}
          releaseDraft: false
          prerelease: false

  build-macos:
    name: Build macOS (.dmg)
    if: github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'macos'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: 'aarch64-apple-darwin'

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract Release Notes
        id: extract_notes
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const content = fs.readFileSync("CHANGELOG.md", "utf8");
            const tag = process.env.GITHUB_REF_NAME || "v3.1.7";
            const match = content.match(new RegExp(`## \\[${tag}\\][^\\n]*\\n([\\s\\S]*?)(?=\\n## \\[|$)`));
            const notes = match ? match[1].trim() : "Music Visualizer Beras release";
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `notes<<EOF\n${notes}\nEOF\n`);
          '

      - name: Build Tauri App macOS
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Music Visualizer Beras ${{ github.ref_name }}'
          releaseBody: ${{ steps.extract_notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
          args: '--target aarch64-apple-darwin'
