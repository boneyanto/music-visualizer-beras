<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="primary-neon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="accent-fuchsia" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="24" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base App Icon Rounded Square -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" stroke="url(#primary-neon)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- Subtle Radial Background Wave Ring -->
  <circle cx="256" cy="256" r="172" stroke="url(#primary-neon)" stroke-width="1.5" stroke-dasharray="6 8" stroke-opacity="0.25"/>
  <circle cx="256" cy="256" r="132" stroke="url(#primary-neon)" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Symmetrical Dynamic Audio Spectrum Bars -->
  <g filter="url(#neon-glow)">
    <rect x="116" y="216" width="24" height="80" rx="12" fill="url(#accent-cyan)" fill-opacity="0.8"/>
    <rect x="156" y="166" width="24" height="180" rx="12" fill="url(#accent-cyan)"/>
    <rect x="196" y="126" width="24" height="260" rx="12" fill="url(#primary-neon)"/>
    <rect x="236" y="86" width="24" height="340" rx="12" fill="url(#primary-neon)"/>
    <rect x="276" y="106" width="24" height="300" rx="12" fill="url(#primary-neon)"/>
    <rect x="316" y="156" width="24" height="200" rx="12" fill="url(#accent-fuchsia)"/>
    <rect x="356" y="196" width="24" height="120" rx="12" fill="url(#accent-fuchsia)"/>
    <rect x="396" y="226" width="24" height="60" rx="12" fill="url(#accent-fuchsia)" fill-opacity="0.8"/>
  </g>

  <!-- Horizontal Pulse Axis -->
  <g filter="url(#soft-glow)">
    <line x1="84" y1="256" x2="428" y2="256" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.85"/>
    <circle cx="256" cy="256" r="14" fill="#ffffff" stroke="url(#primary-neon)" stroke-width="4"/>
    <circle cx="256" cy="256" r="5" fill="#38bdf8"/>
  </g>

  <!-- Sparkle Highlights -->
  <circle cx="128" cy="256" r="3" fill="#ffffff"/>
  <circle cx="384" cy="256" r="3" fill="#ffffff"/>
</svg>
